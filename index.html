<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portfolio</title>
  <meta name="description" content="Portfolio and CV">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="page">

    <aside class="sidebar" id="sidebar">
      <div class="profile">
        <div class="avatar" id="avatar"></div>
        <div class="profile-text">
          <h1 id="name"></h1>
          <p class="badge" id="title"></p>
        </div>
        <button class="more" id="more" type="button" aria-expanded="false" aria-controls="contacts">Show contacts</button>
      </div>
      <div class="contacts" id="contacts">
        <hr>
        <ul class="contact-list" id="contact-list"></ul>
        <hr>
        <ul class="social" id="social"></ul>
      </div>
    </aside>

    <main class="panel">
      <nav class="tabs" aria-label="Sections">
        <button type="button" data-tab="about">About</button>
        <button type="button" data-tab="resume">Resume</button>
        <button type="button" data-tab="portfolio">Portfolio</button>
        <button type="button" data-tab="contact">Contact</button>
      </nav>

      <section class="tab" id="tab-about">
        <h2 class="heading">About Me</h2>
        <div id="about-text" class="about-text"></div>
        <h3 class="subheading">What I'm Doing</h3>
        <ul class="services" id="services"></ul>
      </section>

      <section class="tab" id="tab-resume" hidden>
        <h2 class="heading">Resume</h2>
        <div class="cv-bar">
          <a class="btn" id="cv-download" download>Download CV (PDF)</a>
          <span class="muted" id="cv-updated"></span>
        </div>
        <div class="timeline-block">
          <h3 class="subheading with-icon"><span class="icon-box" data-icon="book"></span>Education</h3>
          <ol class="timeline" id="education"></ol>
        </div>
        <div id="experience-groups"></div>
        <h3 class="subheading">Skills</h3>
        <ul class="skills" id="skills"></ul>
      </section>

      <section class="tab" id="tab-portfolio" hidden>
        <h2 class="heading">Portfolio</h2>
        <div class="filters">
          <div class="filter-row" role="group" aria-label="Filter by status" id="status-filters"></div>
          <div class="filter-row" role="group" aria-label="Filter by label" id="label-filters"></div>
        </div>
        <ul class="grid" id="projects"></ul>
        <p class="empty" id="empty" hidden>No projects match these filters. <button type="button" id="reset">Show all projects</button></p>
      </section>

      <section class="tab" id="tab-project" hidden>
        <div id="project-view"></div>
      </section>

      <section class="tab" id="tab-contact" hidden>
        <h2 class="heading">Contact</h2>
        <p class="about-text">The best way to reach me is by email.</p>
        <ul class="email-list" id="email-list"></ul>
        <ul class="social big" id="social-big"></ul>
      </section>
    </main>
  </div>


  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
